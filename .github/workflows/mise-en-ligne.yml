# Mise en ligne d'Alerte Caisse — VERSION GRATUITE (Firebase Spark + GitHub Actions)
# À chaque envoi sur la branche main (ou à la main depuis l'onglet Actions) :
#   1. déploie les règles et index Firestore (pas de Cloud Functions : forfait gratuit)
#   2. compile l'app Manager Android (.apk)
#   3. compile l'app Caisse Windows (.zip)
#   4. publie la page de téléchargement sur Firebase Hosting
#      -> https://<ID_DU_PROJET>.web.app
#
# Réglages à faire une fois dans GitHub (Settings -> Secrets and variables -> Actions) :
#   Secret   FIREBASE_SERVICE_ACCOUNT : contenu complet du fichier JSON de la clé de service
#   Variable FIREBASE_PROJECT_ID      : identifiant du projet Firebase (ex. alerte-caisse-1234)

name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'alerte-caisse' }}
  ORG: tech.geniuslabs

jobs:
  serveur:
    name: Serveur Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clé de service
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Déployer règles et index Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore --project "$PROJECT_ID" --non-interactive
      - name: Activer la connexion des postes de caisse (anonyme)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install --no-save firebase-admin@12
          node tools/auth_anonyme.js

  android:
    name: App Manager · Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer le projet
        run: |
          flutter create --platforms=android --org "$ORG" --project-name alerte_caisse .
          python3 tools/ci_prepare.py
      - name: Relier Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools
          dart pub global activate flutterfire_cli
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutterfire configure --yes --project="$PROJECT_ID" --platforms=android \
            --android-package-name="$ORG.alerte_caisse" \
            --service-account="$RUNNER_TEMP/sa.json" --overwrite-firebase-options
      - name: Clé de signature Play Store
        env:
          SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          # Secret ANDROID_SIGNING = "motdepasse:fichier .p12 en base64" (une seule fois, voir docs/play-store).
          if [ -n "$SIGNING" ]; then
            PW="${SIGNING%%:*}"; echo "::add-mask::$PW"
            echo "${SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
            echo "UPLOAD_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "Signature : clé Play Store" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Secret ANDROID_SIGNING absent : app signée en mode test, pas envoyable au Play Store."
          fi
      - name: Vérifier le code (analyse)
        run: |
          flutter pub get
          flutter --version | head -1 >> "$GITHUB_STEP_SUMMARY"
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyse.log 2>&1 && echo "::notice::Analyse du code : aucune erreur" || {
            grep -E "^\s*error " analyse.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          grep -E "^\s*warning " analyse.log | head -15 | while IFS= read -r l; do echo "::warning::$l"; done
      - name: Compiler l'app Android (Play Store + APK)
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          # Vérification du code (app mobile ET app PC) : toute erreur arrête la mise en ligne.
          flutter analyze --no-fatal-infos --no-fatal-warnings lib > analyse.log 2>&1 || true
          grep -E "^ *warning •" analyse.log | head -20 | while IFS= read -r l; do echo "::warning::$l"; done
          if grep -qE "^ *error •" analyse.log; then
            grep -E "^ *error •" analyse.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "Analyse du code : $(tail -1 analyse.log)" | tee -a "$GITHUB_STEP_SUMMARY"
          BUILD=$((100 + GITHUB_RUN_NUMBER))   # numéro de version croissant exigé par le Play Store
          set -o pipefail
          if ! flutter build appbundle --release --build-number=$BUILD -t lib/main_manager.dart 2>&1 | tee build.log; then
            grep -iE "error|exception|failed|what went wrong" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          # APK pour tous les téléphones Android (tous processeurs, Android 7 et plus).
          flutter build apk --release --build-number=$BUILD -t lib/main_manager.dart
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/AlerteManager-tous-telephones.apk
          # Une APK par processeur : ~20 Mo au lieu de 55 Mo (téléchargement direct, hors Play Store).
          flutter build apk --release --split-per-abi --build-number=$BUILD -t lib/main_manager.dart
          cp build/app/outputs/bundle/release/app-release.aab out/AlerteManager-PlayStore.aab
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/AlerteCaisse-Manager.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/AlerteCaisse-Manager-ancien-telephone.apk
          # Vérifications : signature, version et permissions réellement présentes dans l'app.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging out/AlerteCaisse-Manager.apk | grep -E "^package|targetSdk|uses-permission|application-label:" | tee -a "$GITHUB_STEP_SUMMARY"
          APKS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for f in out/*.apk; do "$APKS" verify "$f" || { echo "::error::$f : signature invalide"; exit 1; }; done
          keytool -printcert -jarfile out/AlerteManager-PlayStore.aab | grep -E "Owner|SHA256" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  essai:
    name: Essai sur téléphone virtuel
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]   # Android 10 et Android 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - name: Activer l'accélération (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/test_emulateur.sh out/AlerteManager-tous-telephones.apk
      - name: Garder la capture d'écran
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f ecran-android.png ] || exit 0
          mv ecran-android.png ecran-android-${{ matrix.api }}.png
          gh release view essai --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create essai --repo "$GITHUB_REPOSITORY" --prerelease --title "Captures des essais automatiques" --notes "Fichiers de vérification, pas une version de l'app."
          gh release upload essai ecran-android-${{ matrix.api }}.png --repo "$GITHUB_REPOSITORY" --clobber

  playstore:
    name: Envoi au Play Store
    # Seulement si l'app s'installe et démarre sur les téléphones virtuels.
    needs: [android, essai]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Envoyer la version et la fiche
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          npm install --no-save google-auth-library@9
          export VERSION_NAME="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1) ($((100 + GITHUB_RUN_NUMBER)))"
          node tools/play_publish.js out/AlerteManager-PlayStore.aab

  test-android:
    name: Test sur téléphone Android virtuel
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - name: Activer l'accélération (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/test_emulateur.sh out/AlerteManager-tous-telephones.apk
      - name: Garder la capture d'écran
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s ecran-android.png ] || exit 0
          gh release view test-ecran --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create test-ecran --repo "$GITHUB_REPOSITORY" --prerelease --title "Captures de test" --notes "Captures d'écran des tests automatiques."
          gh release upload test-ecran ecran-android.png --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: App Caisse · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer le projet
        shell: bash
        run: |
          flutter create --platforms=windows --org "$ORG" --project-name alerte_caisse .
          python tools/ci_prepare.py
          cp assets/icon/caisse.ico windows/runner/resources/app_icon.ico   # icône de l'app
          # Nom affiché par Windows (Gestionnaire des tâches, propriétés du fichier)
          sed -i 's/"FileDescription", "[^"]*"/"FileDescription", "Alerte Caisse"/; s/"ProductName", "[^"]*"/"ProductName", "Alerte Caisse"/; s/"CompanyName", "[^"]*"/"CompanyName", "Genius Labs"/' windows/runner/Runner.rc
      - name: Relier Firebase
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools
          dart pub global activate flutterfire_cli
          dart pub global run flutterfire_cli:flutterfire configure --yes --project="$PROJECT_ID" --platforms=windows \
            --service-account="$RUNNER_TEMP/sa.json" --overwrite-firebase-options
      - name: Compiler pour Windows
        shell: bash
        env:
          # Le SDK C++ Firebase déclare une ancienne version de CMake, refusée par CMake 4.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          flutter pub get
          set -o pipefail
          if ! flutter build windows --release -t lib/main_caisse.dart 2>&1 | tee build.log; then
            grep -iE "error|exception|failed" build.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          REL=build/windows/x64/runner/Release
          # Bibliothèques Microsoft Visual C++ fournies avec l'app : elle démarre même sur un PC
          # où elles ne sont pas installées (sinon « VCRUNTIME140.dll introuvable »).
          for d in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$d" "$REL/"; done
          mkdir -p out
          (cd "$REL" && 7z a -tzip ../../../../../out/AlerteCaisse-Caisse-Windows.zip .)
      - name: Programme d'installation (setup .exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value) + ".$env:GITHUB_RUN_NUMBER"
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutDir=$PWD\out" installer\alerte-caisse.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Échec du programme d'installation"; exit 1 }
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  page:
    name: Page de téléchargement
    needs: [serveur, android, windows]
    # Publie dès que l'APK Android est prêt, même si Windows a échoué.
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Outils Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools
      - name: Publier les fichiers (GitHub Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p files
          find dl -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.aab' -o -name '*.exe' \) -exec cp {} files/ \;
          ls -la files
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="v$VERSION-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --title "Alerte Caisse $VERSION" --notes "App Manager (Android : .aab pour le Play Store, .apk en direct) et App Caisse (Windows)." --latest
      - name: Configuration web (Firebase)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          APPID=$(firebase apps:list WEB --project "$PROJECT_ID" --json | jq -r '.result[0].appId // empty')
          if [ -z "$APPID" ]; then
            APPID=$(firebase apps:create WEB "Alerte Caisse Web" --project "$PROJECT_ID" --json | jq -r '.result.appId')
          fi
          firebase apps:sdkconfig WEB "$APPID" --project "$PROJECT_ID" --json | jq '.result.sdkConfig' > cfg.json
          jq -e '.apiKey and .projectId and .appId' cfg.json > /dev/null
          echo "export default $(cat cfg.json);" > public/js/firebase-config.js
          echo "Config web OK ($APPID)"
      - name: Assembler la page
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          DATE=$(date -u +%d/%m/%Y)
          sed -i "s/__VERSION__/$VERSION/g; s#__DATE__#$DATE#g; s#__REPO__#$GITHUB_REPOSITORY#g" public/index.html
          rm -rf public/downloads
      - name: Publier sur Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          if ! firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive 2>&1 | tee deploy.log; then
            grep -iE "error|denied|permission|not found|failed" deploy.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "Page en ligne : https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
