# Renvoie au Play Store la dernière version déjà compilée (sans tout recompiler).
name: Envoi au Play Store
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer la dernière version compilée
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'AlerteManager-PlayStore.aab' --dir out
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
      - name: Envoyer la version et la fiche
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          npm install --no-save google-auth-library@9
          node tools/play_publish.js out/AlerteManager-PlayStore.aab
