<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10263d">
<title>Alerte Caisse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #eef0f3; --surface: #ffffff; --surface-2: #f4f5f8; --line: #d9dde4; --fg: #1a1e25; --muted: #5c6472;
  --accent: #c62828; --ok: #2e7d32; --ok-soft: #e3f1e4; --warn: #b85f00; --warn-soft: #fcefdc; --alarm-soft: #fbe4e4;
  --side: #10263d; --side-2: #183552; --side-fg: #e7eef6; --side-muted: #9fb3c8;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --surface: #191d23; --surface-2: #21262e; --line: #313843; --fg: #e8ebf0; --muted: #9aa3b1;
    --accent: #ef5350; --ok: #66bb6a; --ok-soft: #1c3220; --warn: #f0a63a; --warn-soft: #382a13; --alarm-soft: #3c1b1b;
    --side: #0a1a2a; --side-2: #10283f; --side-fg: #dfe8f2; --side-muted: #8aa0b7; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.tab-nums { font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 9px; padding: 10px 14px; font-weight: 600; text-align: center; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.red { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.green { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.big { padding: 15px; font-size: 17px; font-family: var(--font-display); font-weight: 800; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input, .field select { width: 100%; padding: 12px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.pw { position: relative; }
.pw input { padding-right: 48px; }
.pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); padding: 6px 8px; font-size: 13px; font-weight: 700; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: inherit; padding: 5px 10px; font-weight: 700; font-size: 13px; opacity: .65; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); opacity: 1; }
.error { color: var(--accent); font-weight: 600; font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); }
.hint kbd { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); }
.banner { padding: 10px 16px; font-size: 14px; font-weight: 600; background: var(--warn-soft); color: var(--warn); border-radius: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }
.center { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 14px; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo i { width: 40px; height: 40px; border-radius: 50%; background: #c62828; display: grid; place-items: center; flex: none; }
.logo svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.2; }
.logo b { font-family: var(--font-display); font-size: 20px; display: block; line-height: 1.15; }
.logo span { font-size: 13px; color: var(--muted); }

/* ---------- CAISSE ---------- */
.desk { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
@media (max-width: 760px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.side { background: var(--side); color: var(--side-fg); padding: 20px 18px; display: flex; flex-direction: column; gap: 18px; }
.side .who { background: var(--side-2); border-radius: 10px; padding: 12px; display: grid; gap: 2px; }
.side .who .big { font-family: var(--font-display); font-size: 26px; font-weight: 800; line-height: 1.1; }
.side .muted { color: var(--side-muted); font-size: 13px; }
.side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--side-muted); font-family: var(--font-body); font-weight: 700; }
.side .logo span { color: var(--side-muted); }
.duty-list { display: grid; gap: 6px; }
.duty-list div { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.duty-list .dot { width: 8px; height: 8px; border-radius: 50%; background: #66bb6a; flex: none; }
.side .foot { margin-top: auto; display: grid; gap: 8px; }
.side .lang { border-color: var(--side-2); justify-self: start; }
.side .lang button[aria-pressed="true"] { background: var(--side-fg); color: var(--side); }
.side .sbtn { background: none; border: 1px solid var(--side-2); color: var(--side-fg); border-radius: 8px; padding: 9px 12px; font-size: 14px; text-align: left; font-weight: 600; }
.side .sbtn.logout { background: #c62828; border-color: #c62828; color: #fff; }
.desk-main { padding: 24px clamp(16px, 3vw, 36px) 40px; display: grid; gap: 20px; align-content: start; min-width: 0; }
.desk-main h1 { font-size: 24px; font-weight: 800; }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.type { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px; text-align: left; padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; }
.type kbd { font-family: var(--font-mono); font-size: 12px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.type[aria-pressed="true"] { border-color: var(--accent); background: var(--alarm-soft); color: var(--accent); }
.type[aria-pressed="true"] kbd { background: var(--accent); color: #fff; border-color: var(--accent); }
.send-row { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: end; }
@media (max-width: 980px) { .send-row { grid-template-columns: minmax(0, 1fr); } }
.big-red { min-height: 72px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.big-red:active { transform: translateY(3px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.big-red:disabled { opacity: .6; }
.mine { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); }
.mrow .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.mrow .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
.mrow.wait .ic { background: var(--warn-soft); color: var(--warn); }
.mrow.taken { border-color: var(--ok); background: var(--ok-soft); }
.mrow.taken .ic { background: var(--ok); color: #fff; }
.mrow b { display: block; }
.mrow .sub { font-size: 14px; color: var(--muted); }
.mrow.taken .sub { color: var(--ok); font-weight: 700; font-size: 16px; }
.empty { color: var(--muted); padding: 14px; border: 1.5px dashed var(--line); border-radius: 11px; }
.flash { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; left: 16px; max-width: 460px; margin-left: auto; background: var(--ok); color: #fff; border-radius: 14px; padding: 16px 18px; z-index: 40; display: flex; gap: 14px; align-items: center; box-shadow: 0 14px 34px rgba(0,0,0,.25); }
.flash svg { width: 34px; height: 34px; stroke: #fff; fill: none; stroke-width: 2; flex: none; }
.flash b { font-family: var(--font-display); font-size: 20px; display: block; }

/* ---------- MANAGER ---------- */
.mob { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.mtop { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mtop h1 { font-size: 20px; font-weight: 800; }
.mtop .me { font-size: 13px; color: var(--muted); }
.dutybar { display: grid; gap: 10px; padding: 14px 16px; }
.dutybar.on { background: var(--ok-soft); color: var(--ok); grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.dutybar.off { background: var(--surface-2); color: var(--muted); }
.dutybar b { display: block; font-size: 15px; }
.dutybar span { font-size: 13px; }
.dutybar .linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 2px; justify-self: center; }
.gate { margin: 12px 16px 0; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; gap: 8px; }
.gate b { font-family: var(--font-display); font-size: 17px; }
.gate button { background: #fff; color: var(--accent); border: 0; border-radius: 10px; padding: 12px; font-weight: 800; }
.mbody { flex: 1; padding: 14px 16px 110px; display: grid; gap: 12px; align-content: start; }
.calm { text-align: center; padding: 44px 10px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.calm svg { width: 56px; height: 56px; stroke: var(--ok); fill: none; stroke-width: 1.8; }
.calm b { color: var(--fg); font-size: 17px; }
.acard { background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; padding: 14px; display: grid; gap: 6px; }
.acard.taken { border-color: var(--warn); }
.acard .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.acard .reg { font-family: var(--font-display); font-weight: 800; font-size: 21px; }
.acard .ago { font-size: 13px; color: var(--muted); }
.acard .what { font-weight: 700; font-size: 16px; }
.acard .meta { font-size: 13px; color: var(--muted); }
.acard .by { font-weight: 700; color: var(--warn); }
.acard .btn { padding: 13px; font-size: 16px; font-family: var(--font-display); font-weight: 800; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; }
.stat span { font-size: 13px; color: var(--muted); }
.hrow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.hrow .n { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--font-mono); font-size: 14px; }
.hrow b { display: block; font-size: 14px; }
.hrow span { display: block; font-size: 12px; color: var(--muted); }
.st { font-weight: 700; font-size: 13px; }
.st.open { color: var(--accent); } .st.taken { color: var(--warn); } .st.resolved { color: var(--ok); } .st.cancelled { color: var(--muted); }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-family: var(--font-body); font-weight: 700; }
.tones { display: grid; gap: 6px; }
.tone { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); }
.tone.sel { border-color: var(--accent); background: var(--alarm-soft); }
.tone input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.tone label { font-weight: 600; cursor: pointer; }
.tone label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.tone .play { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 99px; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; }
.tone .play svg { width: 14px; height: 14px; fill: currentColor; }
.range { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.range input { width: 100%; accent-color: var(--accent); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar > div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tabbar button { border: 0; background: transparent; color: var(--muted); padding: 6px 4px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 700; border-radius: 10px; position: relative; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
.tabbar button[aria-selected="true"] { color: var(--accent); background: var(--alarm-soft); }
.tabbar .count { position: absolute; top: 2px; right: calc(50% - 22px); background: var(--accent); color: #fff; border-radius: 99px; font-size: 11px; min-width: 18px; padding: 0 5px; font-style: normal; }
.alarm { position: fixed; inset: 0; z-index: 30; background: #b71c1c; color: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; padding: calc(48px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
.alarm .ring { width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; animation: ring 1s infinite; margin-bottom: 18px; }
.alarm .ring svg { width: 54px; height: 54px; stroke: #fff; fill: none; stroke-width: 2; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.5); } 100% { box-shadow: 0 0 0 30px rgba(255,255,255,0); } }
.alarm .k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; opacity: .85; }
.alarm h2 { font-size: 40px; font-weight: 800; margin: 4px 0; }
.alarm .w { font-size: 19px; font-weight: 700; }
.alarm .who { opacity: .85; }
.alarm .msg { margin-top: 10px; background: rgba(0,0,0,.2); border-radius: 8px; padding: 8px 12px; }
.alarm .acts { margin-top: auto; width: 100%; max-width: 420px; display: grid; gap: 10px; }
.alarm .go { background: #fff; color: #b71c1c; border: 0; border-radius: 16px; padding: 18px; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.alarm .later { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.6); border-radius: 16px; padding: 12px; font-weight: 600; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); color: var(--fg); border-radius: 16px; padding: 20px; width: min(420px, 100%); display: grid; gap: 12px; max-height: calc(100vh - 32px); overflow: auto; }
.modal h2 { font-size: 19px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .alarm .ring { animation: none; } }
</style>
</head>
<body>
<div id="root"><div class="center"><p class="hint">Chargement…</p></div></div>
<div id="alarm" class="alarm" hidden role="alertdialog" aria-live="assertive"></div>
<div id="modal" class="modal-bg" hidden></div>
<div id="flash" class="flash" hidden role="status"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
