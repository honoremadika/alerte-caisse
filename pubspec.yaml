name: alerte_caisse
description: Alertes caisse -> managers en temps réel (desktop + mobile).
publish_to: 'none'
version: 2.0.0+100

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2   # langue choisie, raccourci
  flutter_foreground_task: ^8.14.0  # Android : reste à l'écoute pendant le service (version gratuite, sans serveur)
  # Ordinateur caissier : fenêtre flottante toujours visible + raccourci clavier global
  window_manager: ^0.4.2
  hotkey_manager: ^0.2.3
  launch_at_startup: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Icône de l'app : `dart run flutter_launcher_icons` (fait par la compilation automatique)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/manager.png
  adaptive_icon_background: "#C62828"
  adaptive_icon_foreground: assets/icon/manager-fg.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
