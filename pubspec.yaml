name: alerte_caisse
description: Alertes caisse -> managers en temps réel (desktop + mobile).
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2   # langue choisie, raccourci
  geolocator: ^13.0.1          # vérification "je suis au magasin" à la prise de service
  flutter_foreground_task: ^8.14.0  # Android : reste à l'écoute pendant le service (version gratuite, sans serveur)
  # Ordinateur caissier : fenêtre flottante toujours visible + raccourci clavier global
  window_manager: ^0.4.2
  hotkey_manager: ^0.2.3
  launch_at_startup: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
